<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administrar | Ninfa Cantú</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    // Vista previa con los estilos reales del sitio
    CMS.registerPreviewStyle("/assets/css/estilos.css");
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap");

    var h = CMS.h || window.h;
    var NoticiaPreview = createClass({
      render: function () {
        var e = this.props.entry;
        var img = e.getIn(["data", "imagen"]);
        var src = img ? this.props.getAsset(img) : null;
        return h("article", { className: "nota" },
          h("header", { className: "nota__cab contenedor contenedor--angosto" },
            h("p", { className: "meta" }, h("span", { className: "meta__cat" }, e.getIn(["data", "categoria"]))),
            h("h1", { className: "nota__titulo" }, e.getIn(["data", "title"])),
            h("p", { className: "nota__resumen" }, e.getIn(["data", "resumen"]))
          ),
          src ? h("figure", { className: "nota__img contenedor" }, h("img", { src: src.toString() })) : null,
          h("div", { className: "prosa contenedor contenedor--angosto" }, this.props.widgetFor("body"))
        );
      }
    });
    CMS.registerPreviewTemplate("noticias", NoticiaPreview);
  </script>
</body>
</html>
