# Panel de administración (Decap CMS)
# Inicia sesión en https://ninfacantu.com/admin/
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Nueva {{collection}}: {{slug}}"
    update: "Actualiza {{collection}}: {{slug}}"
    delete: "Elimina {{collection}}: {{slug}}"
    uploadMedia: "Sube imagen {{path}}"
    deleteMedia: "Elimina imagen {{path}}"

locale: es
site_url: https://ninfacantu.com
display_url: https://ninfacantu.com
logo_url: https://ninfacantu.com/assets/img/favicon.png

media_folder: static/assets/uploads
public_folder: /assets/uploads

collections:
  # ---------------- Noticias ----------------
  - name: noticias
    label: Noticias
    label_singular: Noticia
    description: Publica noticias, agenda, comunicados y artículos. La más reciente aparece primero en el sitio.
    folder: content/noticias
    create: true
    extension: md
    slug: "{{slug}}"
    sortable_fields: [date, title, categoria]
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    view_filters:
      - { label: Inversión, field: categoria, pattern: Inversión }
      - { label: Economía, field: categoria, pattern: Economía }
      - { label: Internacional, field: categoria, pattern: Internacional }
      - { label: MiPyMEs, field: categoria, pattern: MiPyMEs }
      - { label: Gestión, field: categoria, pattern: Gestión }
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha de publicación, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: Categoría
        name: categoria
        widget: select
        default: Economía
        options: [Inversión, Economía, Internacional, MiPyMEs, Gestión]
      - { label: Imagen de portada, name: imagen, widget: image, required: false, hint: "Horizontal, de preferencia 1200 × 750 px o más." }
      - { label: Pie de foto, name: pie_imagen, widget: string, required: false }
      - { label: Resumen, name: resumen, widget: text, hint: "Una o dos frases. Aparece en la portada y al compartir en redes." }
      - { label: Destacar en portada, name: destacada, widget: boolean, default: false, required: false, hint: "La nota destacada más reciente ocupa el espacio principal de la página de inicio." }
      - { label: Autor, name: autor, widget: string, required: false, hint: "Si lo dejas vacío, aparece «Redacción»." }
      - { label: Medio de la fuente, name: fuente_nombre, widget: string, required: false, hint: "Ej. El Mañana. Se muestra al final de la nota." }
      - { label: Enlace a la fuente, name: fuente_url, widget: string, required: false }
      - { label: Guardar como borrador (no publicar), name: borrador, widget: boolean, default: false, required: false }
      - { label: Texto de la nota, name: body, widget: markdown }

  # ---------------- Perfil, trayectoria y ajustes ----------------
  - name: informacion
    label: Información de Ninfa
    description: Perfil, biografía, cargos y datos de contacto que aparecen en todo el sitio.
    editor: { preview: false }
    files:
      - name: perfil
        label: Perfil y biografía
        file: content/datos/perfil.json
        fields:
          - { label: Nombre completo, name: nombre, widget: string }
          - { label: Cargo actual, name: cargo_actual, widget: string, hint: "Aparece debajo del nombre en la página de inicio." }
          - { label: Frase o lema, name: lema, widget: string }
          - { label: Fotografía principal, name: foto, widget: image, hint: "Vertical o cuadrada, con buena iluminación." }
          - { label: Presentación breve, name: bio_corta, widget: text, hint: "Dos o tres líneas para la portada." }
          - { label: Biografía completa, name: biografia, widget: markdown }
          - { label: Mensaje destacado, name: mensaje, widget: text, required: false, hint: "Aparece en la franja guinda de la portada, junto a su foto." }
          - { label: Origen del mensaje, name: mensaje_fuente, widget: string, required: false }
          - label: Datos destacados
            name: logros
            widget: list
            label_singular: dato
            summary: "{{fields.cifra}} — {{fields.texto}}"
            hint: "Se muestran en la franja guinda de la portada. Lo ideal son 4."
            fields:
              - { label: Cifra o palabra corta, name: cifra, widget: string, hint: "Ej. 25, +10 mil, 3" }
              - { label: Descripción, name: texto, widget: string }
          - { label: Correo de contacto, name: correo, widget: string, required: false }
          - { label: Teléfono, name: telefono, widget: string, required: false }
          - label: Redes sociales
            name: redes
            widget: object
            hint: "Pega el enlace completo. Deja vacío lo que no uses."
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: X (Twitter), name: x, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }

      - name: trayectoria
        label: Trayectoria y cargos
        file: content/datos/trayectoria.json
        fields:
          - label: Cargos
            name: cargos
            widget: list
            label_singular: cargo
            summary: "{{fields.inicio}} — {{fields.cargo}}"
            hint: "Ordénalos del más reciente al más antiguo; puedes arrastrarlos."
            fields:
              - { label: Cargo o puesto, name: cargo, widget: string }
              - { label: Institución u organización, name: institucion, widget: string }
              - { label: Año de inicio, name: inicio, widget: string }
              - { label: Año de término, name: fin, widget: string, required: false }
              - { label: Es su cargo actual, name: actual, widget: boolean, default: false, required: false }
              - { label: Descripción y logros, name: descripcion, widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list] }

      - name: ejes
        label: Ejes de trabajo y proyectos
        file: content/datos/ejes.json
        fields:
          - label: Ejes de trabajo
            name: ejes
            widget: list
            label_singular: eje
            summary: "{{fields.titulo}}"
            fields:
              - { label: Ícono, name: icono, widget: select, options: [fabrica, grafica, globo, apreton, barco, monedas, tienda, sello, avion, rayo] }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto, name: texto, widget: text }
          - label: Proyectos estratégicos
            name: proyectos
            widget: list
            label_singular: proyecto
            summary: "{{fields.nombre}}"
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Descripción breve, name: texto, widget: string }

      - name: apartado
        label: Nombre y dirección del apartado informativo
        file: content/datos/apartado.json
        fields:
          - { label: Nombre del apartado, name: nombre, widget: string, hint: "Título que se muestra en la página del apartado." }
          - { label: Dirección, name: ruta, widget: string, hint: "Palabra que va después de ninfacantu.com/ (ej. archivo). Sin espacios ni acentos." }
          - { label: Descripción, name: descripcion, widget: text }
          - { label: Publicar el apartado, name: activo, widget: boolean, default: true }

      - name: sitio
        label: Ajustes del sitio
        file: content/datos/sitio.json
        fields:
          - { label: Título del sitio, name: titulo, widget: string }
          - { label: Descripción para buscadores, name: descripcion, widget: text }
          - { label: Dirección del sitio, name: url, widget: string }
          - { label: Orden de los temas, name: categorias, widget: list, hint: "Orden en que aparecen los temas. Los tres primeros se muestran en la portada." }

  # ---------------- Apartado informativo (no aparece en el menú) ----------------
  - name: apartado
    label: Apartado informativo
    label_singular: Nota del apartado
    description: Notas que no se enlazan desde el menú ni desde ninguna página. Se publican en su propia dirección y se incluyen en el sitemap y en llms.txt para buscadores e IA.
    folder: content/apartado
    create: true
    extension: md
    slug: "{{slug}}"
    sortable_fields: [orden, date, title]
    summary: "{{title}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha de actualización, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: Orden, name: orden, widget: number, default: 10, value_type: int, required: false, hint: "Las de número menor aparecen primero." }
      - { label: Resumen, name: resumen, widget: text, required: false }
      - { label: Etiquetas, name: etiquetas, widget: list, required: false, hint: "Palabras clave separadas por coma." }
      - { label: No publicar todavía, name: borrador, widget: boolean, default: false, required: false }
      - { label: Contenido, name: body, widget: markdown }
